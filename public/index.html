<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link href="style.css" rel="stylesheet" />
	</head>
	<body>
		<script src="/socket.io/socket.io.js"></script>

		<script src="signaling.js" defer></script>
		<script src="peer.js" defer></script>

		<!-- adding ui -->
		<div class="chat-body">
			<p id="status">connecting to server...</p>
			<div class="chat-messages" id="chatMessages"></div>
		</div>
		<form class="input-container">
			<input
				type="text"
				name="message"
				class="chat-input"
				placeholder="Type a message..."
				autocomplete="off"
			/>
			<input type="file" id="fileInput" hidden />
			<label for="fileInput" class="attach-label" aria-label="Attach File"
				>📎</label
			>
			<button type="submit" class="send-btn" aria-label="Send message" disabled>
				<!-- paper unicorn send sign -->
				&#10148;
			</button>

			<div
				id="fileNameDisplay"
				class="file-name-container"
				style="display: none"
			>
				<span class="file-text"></span>
				<button type="button" class="remove-file-btn" id="clearFileBtn">
					×
				</button>
			</div>
		</form>

		<script>
			const form = document.querySelector(".input-container");
			const input = document.querySelector(".chat-input");
			const sendBtn = document.querySelector(".send-btn");
			const fileInput = document.querySelector("#fileInput");

			form.addEventListener("submit", async (event) => {
				event.preventDefault();
				if (sendBtn.disabled) return;

				const messageText = input.value.trim();
				const isText = messageText !== "";
				const isFile = fileInput.files.length > 0;

				if (!isText && !isFile) {
					return;
				}

				if (isText) {
					console.log("sending: ", input.value);
					send(messageText);

					input.value = "";
				}
                if(isFile) {
                    await sendFile(fileInput.files[0]);
                    hideFileBadge();
                }
			});

			const fileNameDisplay = document.querySelector("#fileNameDisplay");
			const fileText = fileNameDisplay.querySelector(".file-text");
			const clearFileBtn = document.querySelector("#clearFileBtn");

			fileInput.addEventListener("change", () => {
				if (fileInput.files.length > 0) {
					const chosenFileName = fileInput.files[0].name;
					fileText.textContent = `📁 ${chosenFileName}`;
					fileNameDisplay.style.display = "flex";
				} else {
					hideFileBadge();
				}
			});

			clearFileBtn.addEventListener("click", () => {
				hideFileBadge();
			});

			function hideFileBadge() {
				fileInput.value = "";
				fileText.textContent = "";
				fileNameDisplay.style.display = "none";
			}
		</script>
	</body>
</html>
